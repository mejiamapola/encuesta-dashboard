<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard Encuesta Ciudadanos</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#081126;
    color:white;
}

.container{
    padding:30px;
}

h1{
    font-size:40px;
    margin-bottom:10px;
}

.status{
    margin:20px 0;
    padding:15px;
    background:#0f1f3d;
    border-radius:10px;
}

.metric{
    font-size:28px;
    font-weight:bold;
}

.card{
    background:#0f1f3d;
    padding:20px;
    border-radius:15px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Insight Hub de atención ciudadana</h1>

    <div id="status" class="status">
        Cargando datos automáticamente...
    </div>

    <div class="card">
        <div>Total respuestas:</div>
        <div id="total" class="metric">0</div>
    </div>

</div>

<script>

const FILE_NAME = "Instrumento 2 - Encuesta Ciudadanos.xlsx";

async function cargarDatos(){
    try{
        const response = await fetch(FILE_NAME);

        if(!response.ok){
            document.getElementById("status").innerHTML =
            "❌ No se encontró el Excel en el repositorio.";
            return;
        }

        const data = await response.arrayBuffer();
        const workbook = XLSX.read(data, {type:"array"});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        // 🎯 Aquí cargamos datos
        document.getElementById("total").innerText = json.length;

        document.getElementById("status").innerHTML =
        "✅ Datos cargados automáticamente";

    }catch(e){
        document.getElementById("status").innerHTML =
        "❌ Error cargando datos: " + e.message;
    }
}

cargarDatos();

</script>

</body>
</html>
